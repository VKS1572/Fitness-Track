services:

  mysql:
    image: mysql:8.0
    container_name: fittrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Vik@s1572
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fittrack-network

  service-registry:
    build:
      context: ./service-registry
    image: fittrack-service-registry
    container_name: fittrack-service-registry
    ports:
      - "8761:8761"
    networks:
      - fittrack-network

  user-service:
    build:
      context: ./user-service
    image: fittrack-user-service
    container_name: fittrack-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://fittrack-mysql:3306/fitness_user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Vik@s1572
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://fittrack-service-registry:8761/eureka/

      MAIL_USERNAME: vikaspradhan674@gmail.com
      MAIL_PASSWORD: oxusyswkfuydbdjq

    depends_on:
      - mysql
      - service-registry
    networks:
      - fittrack-network



  activity-service:
    build:
      context: ./activity-service
    image: fittrack-activity-service
    container_name: fittrack-activity-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://fittrack-mysql:3306/fitness_activity_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Vik@s1572
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://fittrack-service-registry:8761/eureka/
    depends_on:
      - mysql
      - service-registry
    networks:
      - fittrack-network

  recommendation-service:
    build:
      context: ./recommendation-service
    image: fittrack-recommendation-service
    container_name: fittrack-recommendation-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://fittrack-service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - fittrack-network

  notification-service:
    build:
      context: ./notification-service
    image: fittrack-notification-service
    container_name: fittrack-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://fittrack-mysql:3306/fitness_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Vik@s1572
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://fittrack-service-registry:8761/eureka/
    depends_on:
      - mysql
      - service-registry
    networks:
      - fittrack-network

  api-gateway:
    build:
      context: ./api-gateway
    image: fittrack-api-gateway
    container_name: fittrack-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://fittrack-service-registry:8761/eureka/
    depends_on:
      - service-registry
      - user-service
      - activity-service
      - recommendation-service
      - notification-service
    networks:
      - fittrack-network

networks:
  fittrack-network:
    name: fittrack-network
    driver: bridge

volumes:
  mysql_data: